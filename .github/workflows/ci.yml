name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Block sensitive public source content
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-public-release.js
          source_root="${RUNNER_TEMP}/source-archive"
          mkdir -p "${source_root}"
          git archive --format=tar HEAD | tar -xf - -C "${source_root}"
          node scripts/verify-public-release.js --root "${source_root}" --require-manifest-completeness
      - name: Verify third-party provenance
        run: npm run verify:third-party
      - name: Enforce Developer Certificate of Origin
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-dco.js "${DCO_BASE_SHA}" "${DCO_HEAD_SHA}"
      - name: Audit reachable Git identities
        run: npm run verify:git-identities
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate add-on
        run: npm run validate

      - name: Build and verify validation installer
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          archive="dist/local-media-proxy-v${version}.tgz"
          npm run package:addon
          node scripts/verify-release-package.js "v${version}" "${archive}"
          (
            cd dist
            sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256"
            sha256sum --check "$(basename "${archive}").sha256"
          )

      - name: Upload validation installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: local-media-proxy-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/local-media-proxy-v*.tgz
            dist/local-media-proxy-v*.tgz.sha256
          retention-days: 1

  artifact-round-trip:
    name: Verify installer artifact round trip
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validation installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-media-proxy-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Verify downloaded installer checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tgz.sha256' | wc -l)" -eq 1
          cd dist
          sha256sum --check ./*.tgz.sha256
