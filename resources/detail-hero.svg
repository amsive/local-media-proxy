<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Local Media Proxy settings and local-first request flow</title>
  <desc id="desc">An Amsive-branded diagram showing existing upload assets served from Local and only safe missing assets fetched through a verified remote connection.</desc>
  <rect width="1200" height="650" rx="20" fill="#f7f2f8"/>
  <path d="M20 0h1160a20 20 0 0 1 20 20v88H0V20A20 20 0 0 1 20 0Z" fill="#6e187a"/>
  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="60" y="53" font-size="29" font-weight="700">Local Media Proxy</text>
    <text x="60" y="82" font-size="16" opacity=".85">Local-first WordPress uploads with a verified remote-site fallback</text>
    <rect x="1012" y="32" width="128" height="44" rx="22" fill="#fff" opacity=".14"/>
    <text x="1076" y="60" font-size="15" font-weight="700" text-anchor="middle">BY AMSIVE</text>
  </g>

  <rect x="60" y="150" width="440" height="374" rx="16" fill="#fff" stroke="#d9c9dc" stroke-width="2"/>
  <circle cx="105" cy="194" r="20" fill="#ead9ed"/>
  <path d="M95 194h20M105 184v20" stroke="#6e187a" stroke-linecap="round" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="140" y="190" fill="#2a2030" font-size="21" font-weight="700">Your Local site</text>
    <text x="140" y="214" fill="#6f6573" font-size="14">/wp-content/uploads/</text>

    <rect x="92" y="252" width="376" height="82" rx="11" fill="#f3fbf7" stroke="#86c9a4"/>
    <rect x="112" y="270" width="48" height="45" rx="7" fill="#d6f2e2"/>
    <circle cx="127" cy="283" r="5" fill="#218455"/>
    <path d="m118 307 11-12 8 8 6-6 9 10" fill="none" stroke="#218455" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="181" y="284" fill="#254231" font-size="16" font-weight="700">Asset exists locally</text>
    <text x="181" y="309" fill="#4d6a59" font-size="14">Serve it immediately from Local</text>
    <rect x="386" y="273" width="62" height="30" rx="15" fill="#d6f2e2"/>
    <text x="417" y="293" fill="#176737" font-size="12" font-weight="700" text-anchor="middle">LOCAL</text>

    <rect x="92" y="354" width="376" height="116" rx="11" fill="#fcf8fd" stroke="#aa77b1" stroke-dasharray="7 5"/>
    <rect x="112" y="378" width="48" height="45" rx="7" fill="#ead9ed"/>
    <path d="M122 389h28v23h-28zM126 406l7-7 5 5 4-4 5 6" fill="none" stroke="#6e187a" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="181" y="392" fill="#4b2751" font-size="16" font-weight="700">Safe asset is missing</text>
    <text x="181" y="417" fill="#6f6573" font-size="14">Request only this file remotely</text>
    <text x="181" y="442" fill="#6e187a" font-size="13" font-weight="700">GET and HEAD only</text>
  </g>

  <path d="M526 338h130" fill="none" stroke="#6e187a" stroke-linecap="round" stroke-width="8"/>
  <path d="m641 318 24 20-24 20" fill="none" stroke="#6e187a" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
  <rect x="530" y="276" width="130" height="38" rx="19" fill="#ead9ed"/>
  <text x="595" y="300" fill="#6e187a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700" text-anchor="middle">ONLY IF MISSING</text>

  <rect x="690" y="150" width="450" height="374" rx="16" fill="#241629" stroke="#6e187a" stroke-width="2"/>
  <circle cx="737" cy="194" r="20" fill="#6e187a"/>
  <path d="M727 199c0-11 20-11 20 0M732 187a6 6 0 1 1 10 0" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="772" y="190" fill="#fff" font-size="21" font-weight="700">Remote site endpoint</text>
    <text x="772" y="214" fill="#cdbed1" font-size="14">Selected IP with hostname preserved</text>

    <text x="730" y="272" fill="#bba9c0" font-size="13" font-weight="700">SITE URL</text>
    <rect x="730" y="288" width="370" height="50" rx="8" fill="#38253e" stroke="#69526f"/>
    <text x="752" y="319" fill="#fff" font-size="16">https://example.com</text>

    <text x="730" y="378" fill="#bba9c0" font-size="13" font-weight="700">REMOTE IP ADDRESS</text>
    <rect x="730" y="394" width="370" height="50" rx="8" fill="#38253e" stroke="#69526f"/>
    <text x="752" y="425" fill="#fff" font-size="16">192.0.2.10</text>

    <circle cx="748" cy="480" r="11" fill="#5bd39a"/>
    <path d="m743 480 4 4 7-9" fill="none" stroke="#18392a" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
    <text x="770" y="485" fill="#d8f8e9" font-size="14" font-weight="700">Hostname and certificate verified</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700">
    <rect x="150" y="566" width="180" height="42" rx="21" fill="#ead9ed"/>
    <text x="240" y="592" fill="#5a2262" text-anchor="middle">LOCAL ALWAYS WINS</text>
    <rect x="350" y="566" width="160" height="42" rx="21" fill="#ead9ed"/>
    <text x="430" y="592" fill="#5a2262" text-anchor="middle">MISSING ONLY</text>
    <rect x="530" y="566" width="150" height="42" rx="21" fill="#ead9ed"/>
    <text x="605" y="592" fill="#5a2262" text-anchor="middle">READ-ONLY</text>
    <rect x="700" y="566" width="170" height="42" rx="21" fill="#d9f4e5"/>
    <text x="785" y="592" fill="#176737" text-anchor="middle">VERIFIED TLS</text>
  </g>
</svg>
